  <g fill="#f7f1e7">
    <text x="110" y="165" font-family="'Noto Serif SC','Songti SC','STSong',serif" font-size="74" font-weight="700" letter-spacing="7">摄政王·远岬</text>
    <text x="116" y="220" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24" letter-spacing="5" opacity="0.9">现实主义底色的现代公路浪漫史诗</text>
    <text x="116" y="272" font-family="Georgia,serif" font-size="17" letter-spacing="4" opacity="0.66">REGENT · FAR CAPE</text>
  </g>

  <rect x="110" y="310" width="510" height="1" fill="#f7f1e7" opacity="0.35"/>
  <text x="114" y="353" fill="#f7f1e7" opacity="0.88" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="21">
    伙伴、机器、北美生活与不断延伸的美洲公路
