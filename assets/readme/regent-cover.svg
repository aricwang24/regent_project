<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">《摄政王·远岬》仓库封面</title>
  <desc id="desc">夕阳、群山、公路与一辆驶向远方的美式房车</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13233a"/>
      <stop offset="0.48" stop-color="#8f5362"/>
      <stop offset="1" stop-color="#f2a45f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4e55"/>
      <stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5c7"/>
      <stop offset="1" stop-color="#ffbd68"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#sky)"/>
  <circle cx="1260" cy="165" r="92" fill="#ffd38a" opacity="0.28" filter="url(#glow)"/>
  <circle cx="1260" cy="165" r="63" fill="url(#sun)"/>

