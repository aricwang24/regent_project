  <path d="M0 410 L210 315 L375 395 L570 295 L760 405 L965 315 L1170 410 L1390 305 L1600 390 L1600 620 L0 620 Z" fill="#1d2733"/>
  <path d="M0 470 C280 415 540 420 800 455 C1050 486 1300 468 1600 420 L1600 620 L0 620 Z" fill="#131a21"/>

  <path d="M520 620 L730 402 L875 402 L1110 620 Z" fill="url(#road)"/>
  <path d="M795 620 L805 532 L816 532 L826 620 Z" fill="#e8d8a8" opacity="0.92"/>
  <path d="M809 497 L813 454 L819 454 L822 497 Z" fill="#e8d8a8" opacity="0.88"/>
  <path d="M816 432 L818 409 L821 409 L823 432 Z" fill="#e8d8a8" opacity="0.8"/>

  <g transform="translate(1035 405)">
    <path d="M10 80 L28 27 Q33 10 50 10 L228 10 Q245 10 250 27 L264 80 Z" fill="#ece8df"/>
    <path d="M47 18 L218 18 L232 54 L34 54 Z" fill="#71808f"/>
    <rect x="72" y="0" width="112" height="13" rx="4" fill="#d8d2c7"/>
    <rect x="92" y="-13" width="72" height="14" rx="4" fill="#202831"/>
    <rect x="24" y="57" width="235" height="48" rx="8" fill="#ddd8cf"/>
    <rect x="101" y="66" width="82" height="18" rx="4" fill="#252d35"/>
    <circle cx="63" cy="103" r="24" fill="#11161b"/>
    <circle cx="220" cy="103" r="24" fill="#11161b"/>
    <circle cx="63" cy="103" r="10" fill="#707982"/>
    <circle cx="220" cy="103" r="10" fill="#707982"/>
    <rect x="31" y="68" width="22" height="10" rx="3" fill="#ffc873"/>
    <rect x="229" y="68" width="22" height="10" rx="3" fill="#d94f4f"/>
